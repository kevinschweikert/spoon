when:
  - event: ["push"]
    branch: ["main"]
  - event: ["pull_request"]
    branch: ["main"]

engine: microvm
image: nixos

registry:
  nixpkgs: github:nixos/nixpkgs/nixos-unstable

dependencies:
  - gleam
  - erlang
  - rebar3
  - git

steps:
  - name: "Download dependencies"
    command: "gleam deps download"
  - name: "Run tests"
    command: "gleam test"
  - name: "Check formatting"
    command: "gleam format --check src test"
