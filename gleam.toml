name = "spoon"
version = "1.0.0"

description = "A crawler to extract parts from a presentable soup"
licences = ["MIT"]
repository = { type = "tangled", user = "kevinschweikert", repo = "spoon" }

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
presentable_soup = ">= 2.0.0 and < 3.0.0"
gleam_http = ">= 4.5.0 and < 5.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
argv = ">= 1.1.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
